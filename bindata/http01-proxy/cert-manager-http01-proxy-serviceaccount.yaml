# FILE: bindata/http01-proxy/cert-manager-http01-proxy-serviceaccount.yaml
#
# WHAT IT DOES (max 5 lines):
# ServiceAccount template for HTTP01 proxy pods. Provides identity that gets bound to privileged
# SCC (Security Context Constraint) allowing hostNetwork and NET_ADMIN capability. Controller loads
# this YAML, sets namespace/labels dynamically, and creates ServiceAccount in cluster. Pods reference
# this SA in their spec.serviceAccountName field, inheriting its permissions.
#
# HOW IT DOES IT (max 5 lines):
# Static YAML template embedded into operator binary at compile time (go:embed in bindata.go).
# Controller decodes this using Kubernetes codecs in serviceaccounts.go, modifies namespace and
# labels to match HTTP01Proxy, then applies to cluster. Name is hardcoded (cert-manager-http01-proxy)
# and referenced by DaemonSet template. Labels follow Kubernetes recommended patterns for resource
# organization and filtering.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-http01-proxy
  namespace: cert-manager-operator
  labels:
    app: cert-manager-http01-proxy
    app.kubernetes.io/name: cert-manager-http01-proxy
    app.kubernetes.io/part-of: cert-manager-operator
